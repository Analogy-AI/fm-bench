<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="sc.pageTitle">FM Bench — Squad Showcase</title>
<link rel="stylesheet" href="style.css">
<style>
/* language toggle — human UI only (matches index.html) */
#lang-toggle {
  position: fixed; top: 10px; right: 12px; z-index: 1000;
  font: 600 13px/1 var(--mono, monospace);
  padding: 6px 10px; border-radius: 8px; cursor: pointer;
  border: 1px solid rgba(128,128,128,.4);
  background: rgba(128,128,128,.12); color: inherit;
}
#lang-toggle:hover { background: rgba(128,128,128,.25); }
/* ---- showcase-specific, layered on the shared design tokens ---- */
.sc-wrap { max-width: 1180px; margin: 0 auto; padding: 22px 18px 60px; }
.sc-head { display: flex; flex-wrap: wrap; align-items: baseline;
  gap: 8px 16px; margin-bottom: 6px; }
.sc-head h1 { font-size: 22px; margin: 0; letter-spacing: .01em; }
.sc-head h1 .brand { color: var(--gold); }
.sc-head .sub { color: var(--dim); font-size: 13px; }
.sc-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  margin: 12px 0 20px; }
.sc-controls input { width: 66px; }
.sc-src { font-size: 11.5px; padding: 2px 9px; border-radius: 99px;
  border: 1px solid var(--line); color: var(--dim); }
.sc-src.live { color: var(--good); border-color: rgba(124,200,144,.4); }
.sc-src.sample { color: var(--warn); border-color: rgba(229,160,102,.4); }

/* ---- team card ---- */
.team-card { display: flex; flex-wrap: wrap; gap: 16px 22px; align-items: center;
  background: linear-gradient(180deg, rgba(240,185,67,.06), transparent 70%),
    var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 20px; margin-bottom: 22px; box-shadow: var(--shadow); }
.crest { width: 58px; height: 58px; border-radius: 12px; flex: none;
  display: grid; place-items: center; font-family: var(--mono);
  font-size: 24px; font-weight: 700; color: #221a06;
  background: linear-gradient(150deg, var(--gold), var(--gold-dim));
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
.team-meta { display: flex; flex-direction: column; gap: 2px; min-width: 180px; }
.team-meta .tn { font-size: 19px; font-weight: 600; }
.team-meta .tsub { color: var(--dim); font-size: 12.5px; }
.team-stats { display: flex; gap: 20px; margin-left: auto; flex-wrap: wrap; }
.tstat { display: flex; flex-direction: column; }
.tstat .v { font-family: var(--mono); font-size: 18px; font-weight: 600;
  font-variant-numeric: tabular-nums; }
.tstat .l { font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
  color: var(--faint); }

/* ---- pitch / formation ---- */
.pitch-wrap { margin-bottom: 26px; }
.pitch { position: relative; border-radius: 12px; aspect-ratio: 16/11;
  background:
    repeating-linear-gradient(0deg, #16241b 0 8.5%, #142019 8.5% 17%);
  border: 1px solid var(--line); overflow: hidden;
  box-shadow: var(--shadow); }
.pitch::before { content: ""; position: absolute; inset: 10px;
  border: 1.5px solid rgba(146,167,151,.25); border-radius: 6px; }
.pitch::after { content: ""; position: absolute; left: 10px; right: 10px;
  top: 50%; height: 0; border-top: 1.5px solid rgba(146,167,151,.22); }
.center-circle { position: absolute; left: 50%; top: 50%; width: 22%;
  aspect-ratio: 1; transform: translate(-50%,-50%); border-radius: 50%;
  border: 1.5px solid rgba(146,167,151,.2); }
.spot { position: absolute; transform: translate(-50%,-50%);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  width: 108px; }
.spot .disc { width: 40px; height: 40px; border-radius: 50%; flex: none;
  display: grid; place-items: center; font-family: var(--mono);
  font-size: 12px; font-weight: 700; color: var(--text);
  background: radial-gradient(circle at 35% 30%, var(--raised), var(--panel));
  border: 1.5px solid var(--line); box-shadow: 0 3px 10px rgba(0,0,0,.4);
  transition: transform .12s, border-color .12s; cursor: default; }
.spot:hover .disc { transform: scale(1.12); border-color: var(--gold); }
.spot .nm { font-size: 11px; max-width: 108px; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: rgba(15,23,18,.7); padding: 1px 6px; border-radius: 4px; }
.spot .disc.pos-GK { border-color: rgba(229,160,102,.6); }
.spot .disc.pos-DEF { border-color: rgba(124,160,200,.5); }
.spot .disc.pos-MID { border-color: rgba(124,200,144,.5); }
.spot .disc.pos-FWD { border-color: rgba(240,185,67,.6); }

/* ---- player card grid ---- */
.grid-title { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 12px; }
.grid-title h2 { margin: 0; }
.grid-title .hint { color: var(--faint); font-size: 11.5px;
  text-transform: none; letter-spacing: 0; }
.card-grid { display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); }
.pcard { background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px 13px; display: flex; flex-direction: column;
  gap: 9px; transition: border-color .12s, transform .12s; }
.pcard:hover { border-color: var(--line); transform: translateY(-2px); }
.pcard.best { border-color: rgba(240,185,67,.4);
  background: linear-gradient(180deg, rgba(240,185,67,.05), transparent 60%), var(--panel); }
.pc-top { display: flex; align-items: flex-start; gap: 9px; }
.pc-pos { font-family: var(--mono); font-size: 10.5px; font-weight: 700;
  padding: 2px 6px; border-radius: 5px; flex: none;
  background: var(--panel2); border: 1px solid var(--line); color: var(--dim); }
.pc-pos.GK { color: var(--warn); } .pc-pos.DEF { color: #8cb4e0; }
.pc-pos.MID { color: var(--good); } .pc-pos.FWD { color: var(--gold); }
.pc-id { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.pc-name { font-size: 14px; font-weight: 600; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.pc-sub { color: var(--dim); font-size: 11.5px; }
.pc-star { margin-left: auto; color: var(--gold); font-size: 13px; flex: none; }
/* ability band — faithful to hidden info: a RANGE + confidence letter */
.band-row { display: flex; align-items: center; gap: 8px; }
.band-track { position: relative; flex: 1; height: 8px; border-radius: 99px;
  background: #101a14; border: 1px solid var(--line-soft); overflow: hidden; }
.band-fill { position: absolute; top: 0; bottom: 0; border-radius: 99px; }
.band-fill.A { background: rgba(240,185,67,.85); }
.band-fill.B { background: rgba(240,185,67,.5); }
.band-fill.C { background: rgba(146,167,151,.4); }
.band-txt { font-family: var(--mono); font-size: 11.5px; white-space: nowrap;
  font-variant-numeric: tabular-nums; }
.band-conf { font-family: var(--mono); font-size: 10px; padding: 0 4px;
  border: 1px solid var(--line); border-radius: 3px; color: var(--dim); }
.pc-foot { display: flex; align-items: center; justify-content: space-between;
  gap: 6px; margin-top: 1px; }
.form-dots { display: flex; gap: 3px; }
.fdot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.fdot.on { background: var(--good); } .fdot.mid { background: var(--warn); }
.fdot.off { background: var(--bad); }
.badge { font-size: 10px; padding: 1px 6px; border-radius: 99px;
  border: 1px solid var(--line); color: var(--dim); }
.badge.inj { color: var(--bad); border-color: rgba(223,125,125,.4); }
.badge.listed { color: var(--warn); border-color: rgba(229,160,102,.4); }
.pc-val { font-family: var(--mono); font-size: 12px; color: var(--dim);
  font-variant-numeric: tabular-nums; }
.note { color: var(--faint); font-size: 11.5px; margin: 18px 2px 0;
  line-height: 1.5; }
.err { color: var(--bad); font-size: 13px; margin: 14px 2px; }
@media (prefers-reduced-motion: reduce) {
  .pcard, .spot .disc { transition: none; }
}
</style>
</head>
<body>

<button id="lang-toggle" data-i18n="lang.toggle" title="Language / 语言">中文</button>

<div class="sc-wrap">
  <div class="sc-head">
    <h1 data-i18n-html="sc.title"><span class="brand">⚽ FM Bench</span> — Squad Showcase</h1>
    <span class="sub" data-i18n="sc.sub">A procedurally-generated fictional club, presented in full.</span>
  </div>
  <div class="sc-controls">
    <label class="muted" for="seed" data-i18n="ng.seed">Seed</label>
    <input id="seed" type="number" value="1" min="1">
    <button class="primary" id="load" data-i18n="sc.load">Load squad</button>
    <a href="/"><button data-i18n="sc.back">← Back to game</button></a>
    <span id="src" class="sc-src">—</span>
  </div>

  <div id="team"></div>
  <div class="pitch-wrap">
    <div class="grid-title"><h2 data-i18n="sc.bestXI">Best XI</h2>
      <span class="hint" data-i18n="sc.bestXIHint">auto-selected by ability band × fitness</span></div>
    <div class="pitch" id="pitch">
      <div class="center-circle"></div>
    </div>
  </div>

  <div class="grid-title"><h2 data-i18n="sc.fullSquad">Full squad</h2>
    <span class="hint" data-i18n="sc.fullSquadHint">ability is always a range + confidence — true skill is never revealed</span></div>
  <div class="card-grid" id="grid"></div>

  <p class="note" id="note"></p>
</div>
<script src="i18n.js"></script>
<script src="showcase.js"></script>
</body>
</html>
